events {}

http {
    upstream client {
        server client:80;
    }

    upstream server {
        server server:9001;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://client;
        }

        location /ws/ {
            proxy_pass http://server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
