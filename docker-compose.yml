services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    command: ["/usr/local/bin/collab_server", "--port", "9001"]
    expose:
      - "9001"

  client:
    build:
      context: client
      dockerfile: Dockerfile
    expose:
      - "80"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - server
      - client
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
